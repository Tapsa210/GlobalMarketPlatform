name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: market_data_test
          POSTGRES_USER: market_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market_user -d market_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Initialize test database
        env:
          PGPASSWORD: test-password
        run: |
          for file in database/*.sql; do
            psql -h localhost -p 5432 -U market_user -d market_data_test -f "$file"
          done

      - name: Lint
        run: python -m ruff check .

      - name: Test
        env:
          ALPHA_VANTAGE_API_KEY: test-key
          POSTGRES_DB: market_data_test
          POSTGRES_USER: market_user
          POSTGRES_PASSWORD: test-password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
        run: python -m pytest -q

      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config

  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag global-market-platform:ci .
